# Platform availability matrix — "Overview of the valid data types",
# pasted from Siemens' TIA Portal Information System by the user
# (2026-07-13). confidence: official-doc.
#
# Orthogonal to every other file in type-registry/, the same way
# section-legality.yaml is: this says WHICH CPU FAMILY a type name is
# valid on, not what the type IS (base-types.yaml / system-types.yaml) or
# WHERE it may be declared (section-legality.yaml). Check a type here too
# when linting against a project's actual target CPU.
#
# Column values: true | false | "S7-1500-compatible" — the last one is
# the source table's "X (S7-1500)" footnote-style entries for the
# S7-1200 G2 column, meaning G2 supports the type ONLY when running in
# S7-1500-compatible mode, not its native S7-1200 personality.
#
# STANDING CONVENTION (2026-07-13, user-directed): wherever a source
# table/reference page only distinguishes "S7-1200" vs. "S7-1500" — NO
# separate S7-1200 G2 column at all, which is the case for nearly every
# per-INSTRUCTION memory-area/data-type table pasted into
# instruction-registry/01-bit-logic.yaml, 02-comparators.yaml,
# 03-counters.yaml, and 04-timers.yaml this session — treat S7-1200 G2 as
# following the S7-1500 column, NOT the S7-1200 column. E.g. A/O/X's
# operand memory area (01-bit-logic.yaml: S7-1200 lacks T/C, S7-1500 has
# T/C) means G2 has T/C too, same as S7-1500, despite G2 nominally being
# "a kind of S7-1200." This is a project-specific interpretive rule for
# two-column tables specifically — it does NOT override this FILE's own
# explicit 4-column data above (which sometimes shows G2 diverging from
# S7-1500, e.g. HW_DPMASTER: S7-1500 true, S7-1200 G2 false) since this
# file's rows were transcribed with an actual G2 column, not inferred.
# This matters because the project's primary targets are S7-1200 G2 and
# S7-1500 (see tia_target_platforms memory) — the plain-"S7-1200" column
# in those per-instruction tables is largely out of scope for this
# project, and G2 should default to the S7-1500 answer when no G2-specific
# data exists.
#
# This directly resolves every `confidence: verify-platform` flag
# scattered through base-types.yaml (LWord, LInt, ULInt, LTime,
# LTime_Of_Day) — cross-check the `S7-1200` column here instead of
# re-guessing; all five are confirmed S7-1500-family-only.
#
# Type names match the spelling already used in base-types.yaml /
# system-types.yaml where an entry exists there. Several rows here have
# NO matching entry anywhere else yet (Named value data types, anonymous
# Struct as a top-level concept beyond composition-rules.yaml, Pointer/
# Any/References, the legacy Parameter types) — flagged individually
# below; don't invent structural detail for them, just record that the
# gap exists.

