notes: |
  Resolves two open naming questions from system-types.yaml: this table
  spells EVENT_HWINT / OB_HWINT the same way the Hardware data types page
  did, agreeing with system-types.yaml and disagreeing with
  section-legality.yaml's EVENT_HWNT / OB_HWNT (transcribed from
  data-types-ext). Two independent Siemens sources now agree — treat
  EVENT_HWINT / OB_HWINT as canonical; section-legality.yaml corrected.

  Also explains most of system-types.yaml's "not present in
  section-legality.yaml, confirm real gap" notes: HW_DPMASTER and
  CONN_R_ID are S7-1500-only per this table, so their absence from
  data-types-ext (presumably S7-1200-scoped) is expected, not a gap.
  HW_MODULE was the one exception that didn't resolve cleanly from the
  tables alone — user confirmed (2026-07-13) this file's answer is
  correct there too. Project's primary target CPUs are S7-1200 G2 and
  S7-1500, so `S7-1200 G2`/`S7-1500` are the two columns that matter most
  when deciding whether a gap here is worth chasing down further.
