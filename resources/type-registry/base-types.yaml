  notes: ""

DTL:
  category: date-time
  sizeBits: 96
  signed: null
  numberRepresentations:
    - { form: date-time, range: "Min. DTL#1970-01-01-00:00:00.0 to Max. DTL#2262-04-11-23:47:16.854775807", example: "DTL#2008-12-16-20:30:20.250" }
  addressExamples: []
  availableInPlcTagsEditor: false
  validArrayElement: true
  comparable: true
  comparisonCaution: null
  confidence: official-doc
  source: "Siemens S7-1200 manual — Data types"
  notes: "NOT available in the PLC tags editor — only in block Interface editors or a DB (same restriction as String/Struct/Array). 12-byte fixed structure; a Start value must be entered for every component in the DB editor. STEP 7 allows values beyond the documented max, but the manual recommends staying at/under it to avoid conversion/calculation errors."
  structureLayout:
    - { byte: 0-1, component: Year, type: UInt, range: "1970 to 2262" }
    - { byte: 2, component: Month, type: USInt, range: "1 to 12" }
    - { byte: 3, component: Day, type: USInt, range: "1 to 31" }
    - { byte: 4, component: Weekday, type: USInt, range: "1 (Sunday) to 7 (Saturday)", note: "Not part of the DTL# literal syntax (Year-Month-Day:Hour:Minute:Second.Nanosecond has no weekday field) even though it's a stored component — TIA computes/stores it, don't expect a user-supplied weekday in a literal." }
    - { byte: 5, component: Hour, type: USInt, range: "0 to 23" }
    - { byte: 6, component: Minute, type: USInt, range: "0 to 59" }
    - { byte: 7, component: Second, type: USInt, range: "0 to 59" }
    - { byte: 8-11, component: Nanosecond, type: UDInt, range: "0 to 999999999" }

String:
  category: string
  sizeBits: null
  signed: null
  numberRepresentations:
    - { form: string-literal, range: "n = 0 to 254 bytes (default max 254 if [n] omitted)", example: "'ABC'" }
  addressExamples: []
  availableInPlcTagsEditor: false
  validArrayElement: true
  comparable: true
  comparisonCaution: null
  confidence: official-doc
  source: "Siemens S7-1200 manual — Data types"
  notes: "NOT available in the PLC tags editor — only in block Interface editors (OB/FC/FB/DB). Storage = maxCharCount byte + currentCharCount byte + up to 254 chars. Declare max length with String[n] (e.g. String[10]); omitted [n] defaults to 254. Single-quoted literals only. Supports $-escaped ASCII control chars: $L/$l (line feed), $N/$n (line break, CR+LF), $P/$p (form feed), $R/$r (CR), $T/$t (tab), $$ (literal $), $' (literal single quote)."

WString:
  category: string
  sizeBits: null
  signed: null
  numberRepresentations:
    - { form: string-literal, range: "n = 0 to 65534 words (default max 65534 if [n] omitted)", example: "\"ä123@XYZ.COM\"" }
  addressExamples: []
  availableInPlcTagsEditor: false
  validArrayElement: true
  comparable: true
  comparisonCaution: null
  confidence: official-doc
  source: "Siemens S7-1200 manual — Data types"
  notes: "NOT available in the PLC tags editor. Storage = maxCharCount word + currentCharCount word + up to 65534 double-byte (UTF-16-ish) chars. Declare max length with WString[n]. Double-quoted literals (not single quotes, unlike String/Char)."

Variant:
  category: system
  sizeBits: 0
  signed: null
  numberRepresentations: []
  addressExamples: ["MyTag", "DB_name.Struct_name.element_name (symbolic)", "%MW10 (absolute)", "P#DB10.DBX10.0 INT 12 (absolute, pointer form)"]
  availableInPlcTagsEditor: false
  validArrayElement: false
  comparable: false
  comparisonCaution: "RESOLVED 2026-07-13 — this `comparable: false` means a Variant POINTER itself has no defined equality (comparing two Variants as references isn't a thing). It does NOT contradict instruction-registry/02-comparators.yaml's EQ/NE/GE/LE/GT/LT_Contact family supporting `VARIANT` as a SrcType selection: that mode dereferences the Variant(s) and compares the STRUCTURED VALUE(S) they point to (subject to the STRUCT/ARRAY/PLC-data-type comparison rules in that file — same UDT, or one side genuinely VARIANT/ANY, firmware-version-gated), not the pointers. Two different operations sharing the word 'Variant': comparing the reference (not supported, hence false here) vs. comparing what it references (supported, via the comparator instructions' own rules)."
  confidence: official-doc
  source: "Siemens S7-1200 manual — Data types"
  notes: "Points to variables of different data types or parameters, including structures and individual structure members. Occupies 0 bytes itself (it's a reference, not storage). Used e.g. by VariantGet/VariantPut in instruction-registry/06-move.yaml."

Void:
  category: system
