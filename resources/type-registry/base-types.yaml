# Siemens/IEC 61131-3 elementary data types, as used in .s7dcl VAR
# sections, PLC data type (UDT) STRUCT members, and Datatype attributes.
# See README.md for schema and how this feeds the UDT dependency cache.
#
# Ruleset upgraded against Siemens' own S7-1200 manual, "PLC concepts >
# Data types" (docs.tia.siemens.cloud/r/simatic_s7_1200_manual_collection_enus_20/
# plc-concepts/data-types). confidence: official-doc means every field
# on that entry is transcribed from that manual page, not inferred —
# strictly higher confidence than instruction-registry's TIA-export
# verification (which only proves shape, not documented semantics).
# confidence: verify-platform still flags types the S7-1200 manual
# doesn't cover (S7-1500-only widened types) — check the target CPU.
#
# See also:
#   composition-rules.yaml — Array/Struct/PLC-data-type/Variant composition rules
#   slice-access.md        — "tag".xn / .bn / .wn slice-access grammar
#   bcd-formats.yaml       — BCD16/BCD32 (not real types, conversion-only formats)

Bool:
  category: bit
  sizeBits: 1
  signed: null
  numberRepresentations:
    - { form: boolean, range: "FALSE or TRUE", example: "TRUE" }
    - { form: binary, range: "2#0 or 2#1", example: "2#0" }
    - { form: unsigned-integer, range: "0 or 1", example: "1" }
    - { form: octal, range: "8#0 or 8#1", example: "8#1" }
    - { form: hexadecimal, range: "16#0 or 16#1", example: "16#1" }
  addressExamples: ["I1.0", "Q0.1", "M50.7", "DB1.DBX2.3", "Tag_name"]
  availableInPlcTagsEditor: true
  validArrayElement: true
  comparable: true
  comparisonCaution: null
  confidence: official-doc
  source: "Siemens S7-1200 manual — Data types"
  notes: ""

Byte:
  category: bit-string
  sizeBits: 8
  signed: null
  numberRepresentations:
    - { form: binary, range: "2#0 to 2#1111_1111", example: "2#1000_1001" }
    - { form: unsigned-integer, min: 0, max: 255, example: "15" }
    - { form: signed-integer, min: -128, max: 127, example: "-63" }
    - { form: octal, range: "8#0 to 8#377", example: "8#17" }
    - { form: hexadecimal, range: "B#16#0 to B#16#FF, 16#0 to 16#FF", example: "B#16#F, 16#F" }
  addressExamples: ["IB2", "MB10", "DB1.DBB4", "Tag_name"]
  availableInPlcTagsEditor: true
  validArrayElement: true
  comparable: true
  comparisonCaution: null
  confidence: official-doc
  source: "Siemens S7-1200 manual — Data types"
  notes: ""

Word:
  category: bit-string
  sizeBits: 16
  signed: null
  numberRepresentations:
    - { form: binary, range: "2#0 to 2#1111_1111_1111_1111", example: "2#1101_0010_1001_0110" }
    - { form: unsigned-integer, min: 0, max: 65535, example: "61680" }
    - { form: signed-integer, min: -32768, max: 32767, example: "72" }
    - { form: octal, range: "8#0 to 8#177_777", example: "8#170_362" }
    - { form: hexadecimal, range: "W#16#0 to W#16#FFFF, 16#0 to 16#FFFF", example: "W#16#F1C0, 16#A67B" }
  addressExamples: ["MW10", "DB1.DBW2", "Tag_name"]
  availableInPlcTagsEditor: true
  validArrayElement: true
  comparable: true
  comparisonCaution: null
  confidence: official-doc
  source: "Siemens S7-1200 manual — Data types"
  notes: ""

DWord:
  category: bit-string
  sizeBits: 32
  signed: null
  numberRepresentations:
    - { form: binary, range: "2#0 to 2#1111...(32 bits)", example: "2#1101_0100_1111_1110_1000_1100" }
    - { form: unsigned-integer, min: 0, max: 4294967295, example: "15_793_935" }
    - { form: signed-integer, min: -2147483648, max: 2147483647, example: "-400000" }
    - { form: octal, range: "8#0 to 8#37_777_777_777", example: "8#74_177_417" }
    - { form: hexadecimal, range: "DW#16#0000_0000 to DW#16#FFFF_FFFF, 16#0000_0000 to 16#FFFF_FFFF", example: "DW#16#20_F30A, 16#B_01F6" }
  addressExamples: ["MD10", "DB1.DBD8", "Tag_name"]
  availableInPlcTagsEditor: true
  validArrayElement: true
  comparable: true
  comparisonCaution: null
  confidence: official-doc
  source: "Siemens S7-1200 manual — Data types"
  notes: "'_' is a thousands separator for readability on numbers > 8 digits, not a semantic character — a linter should strip it before parsing a numeric literal."

LWord:
  category: bit-string
  sizeBits: 64
  signed: null
  numberRepresentations:
    - { form: hexadecimal, range: "16#0 to 16#FFFF_FFFF_FFFF_FFFF", example: "16#xxxxxxxxxxxxxxxx" }
  addressExamples: []
  availableInPlcTagsEditor: true
  validArrayElement: true
  comparable: true
  comparisonCaution: null
  confidence: verify-platform
  source: "Not in the S7-1200 manual data-types page — S7-1500 family; not confirmed available on plain S7-1200 (non-G2)."
  notes: "Check target CPU before assuming it compiles."

Char:
  category: character
  sizeBits: 8
  signed: null
  numberRepresentations:
