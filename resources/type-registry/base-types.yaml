  signed: null
  numberRepresentations: []
  addressExamples: []
  availableInPlcTagsEditor: false
  validArrayElement: false
  comparable: false
  comparisonCaution: null
  confidence: standard
  source: "Not in the S7-1200 manual data-types page excerpt."
  notes: "Placeholder type — only legal for unused FB/FC parameters (e.g. a Return value slot of an FC with no return). Not a real storage type."

Any:
  category: system
  sizeBits: 80
  signed: null
  numberRepresentations:
    - { form: pointer-literal, range: null, example: "P#DB11.DBX20.0 INT 10, P#M20.0 BYTE 10, P#I1.0 BOOL 8, P#P0.0 VOID 0, NULL" }
  addressExamples: ["\"MyDB\".StructTag.InitialComponents (symbolic, DB-scoped)", "\"MyMarkerTag\" (symbolic, memory-scoped)", "P#DB11.DBX20.0 INT 10 (absolute)", "P#M20.0 BYTE 10 (absolute)", "P#Zero value / NULL (LAD/FBD only)"]
  availableInPlcTagsEditor: false
  validArrayElement: false
  comparable: false
  comparisonCaution: null
  confidence: official-doc
  source: "Siemens TIA Portal Information System — ANY pointer reference page, pasted by user 2026-07-13"
  notes: "10-byte (80-bit) legacy S7 pointer to a data area + its length, distinct from Variant (0 bytes, no fixed binary layout) despite similar purpose. Legacy per platform-availability.NOTLOADED.yaml: NOT available on plain S7-1200 (S7-300/400 and S7-1500 only). Full binary encoding (data-type byte, repetition-factor, DB number, memory-area byte, start address), the P# literal grammar, and the two coding tables (data type / memory area) are documented in type-registry/any-pointer.yaml rather than duplicated here — see that file before linting any P#-literal or ANY-typed operand. Key semantic limits: cannot identify structures (a UDT-typed operand becomes an opaque ARRAY of BYTE through an ANY pointer — the UDT's own shape is invisible on the other side); can only be assigned to LOCAL tags (not e.g. a global DB tag directly, per the source's own wording); S7-1500 additionally restricts it to 'Standard' (non-optimized) access-mode memory areas only. ANY-pointer-to-STRING behaves differently depending on origin: an ANY generated from a String in LAD/FBD/STL becomes a plain BYTE pointer with repetition factor = the string's max length (losing the 'this was a String' information), while one generated inside SCL keeps a real STRING-typed ANY — don't assume symmetric round-tripping across languages."

Pointer:
  category: system
  sizeBits: 48
  signed: null
  numberRepresentations:
    - { form: pointer-literal, range: null, example: "P#M20.0, P#DB10.DBX20.0, P#0.0, ZERO" }
  addressExamples: ["\"MyTag\" (symbolic, area-internal)", "\"MyDB\".\"MyTag\" (symbolic, DB pointer)", "P#20.0 (absolute, area-internal)", "P#M20.0 (absolute, cross-area)", "P#DB10.DBX20.0 (absolute, DB pointer)", "P#0.0 / ZERO (zero pointer)"]
  availableInPlcTagsEditor: false
  validArrayElement: false
  comparable: false
  comparisonCaution: null
