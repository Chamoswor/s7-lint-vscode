  validArrayElement: true
  comparable: true
  comparisonCaution: null
  confidence: official-doc
  source: "Siemens S7-1200 manual — Data types"
  notes: "Stored as an unsigned DInt = milliseconds since midnight. Hour/minute/second required, fractional second optional. TOD is the manual's own name for this type — treat as the primary name, not just an alias, contradicting the earlier draft of this file."

