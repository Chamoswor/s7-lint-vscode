Real:
  category: float
  sizeBits: 32
  signed: true
  numberRepresentations:
    - { form: floating-point, range: "-3.402823e+38 to -1.175495e-38, ±0, +1.175495e-38 to +3.402823e+38", example: "123.456, -3.4, 1.0e-5" }
  addressExamples: ["MD100", "DB1.DBD8", "Tag_name"]
  availableInPlcTagsEditor: true
  validArrayElement: true
  comparable: true
  comparisonCaution: "6 significant digits of precision. Avoid comparing to an exact value (EQ_Contact/NE_Contact) — calculations mixing very large and very small values (differ by 10^x, x>6) can silently lose the smaller value entirely (100000000 + 1 = 100000000). Use a tolerance/range comparison (InRange/OutRange, or OK/NOK for NaN/inf validity) instead of exact equality."
  confidence: official-doc
  source: "Siemens S7-1200 manual — Data types"
  notes: "ANSI/IEEE 754-1985 single precision."

LReal:
  category: float
  sizeBits: 64
  signed: true
  numberRepresentations:
    - { form: floating-point, range: "-1.7976931348623158e+308 to -2.2250738585072014e-308, ±0, +2.2250738585072014e-308 to +1.7976931348623158e+308", example: "12345.123456789e40, 1.2E+40" }
  addressExamples: []
  availableInPlcTagsEditor: true
  validArrayElement: true
  comparable: true
  comparisonCaution: "15 significant digits of precision. No direct (absolute) addressing support — can only be assigned in an OB/FB/FC block interface table, not via %MD-style direct address. Same float-tolerance caution as Real applies (differ-by-10^15 loses precision)."
  confidence: official-doc
  source: "Siemens S7-1200 manual — Data types"
  notes: "ANSI/IEEE 754-1985 double precision. Used for Runtime's persistent mem/ret_val pins (instruction-registry/10-runtime-control.yaml) — needs the full double precision to avoid drift across scans."

S5Time:
  category: duration
  sizeBits: 16
  signed: null
  numberRepresentations:
    - { form: duration, range: null, example: "S5T#10s" }
  addressExamples: []
  availableInPlcTagsEditor: true
  validArrayElement: true
  comparable: true
  comparisonCaution: null
  confidence: standard
  source: "Not in the S7-1200 manual data-types page excerpt — legacy S5-style duration, still selectable in TIA."
  notes: "Prefer Time/LTime in new code."

Time:
  category: duration
  sizeBits: 32
  signed: true
  numberRepresentations:
    - { form: duration, range: "T#-24d_20h_31m_23s_648ms to T#24d_20h_31m_23s_647ms (stored as -2,147,483,648 ms to +2,147,483,647 ms)", example: "T#5m_30s, T#1d_2h_15m_30s_45ms, TIME#10d20h30m20s630ms, 500h10000ms, 10d20h30m20s630ms" }
  addressExamples: []
  availableInPlcTagsEditor: true
  validArrayElement: true
  comparable: true
  comparisonCaution: null
  confidence: official-doc
  source: "Siemens S7-1200 manual — Data types"
  notes: "Stored as a signed DInt interpreted as milliseconds. Units (d/h/m/s/ms) are all optional — T#5h10s and 500h are both valid — but the combined value must not exceed the ms range above. TIME# and bare (no T#) forms are also accepted per the manual's own examples."

LTime:
  category: duration
  sizeBits: 64
  signed: true
  numberRepresentations:
