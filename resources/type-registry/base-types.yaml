  addressExamples: []
  availableInPlcTagsEditor: true
  validArrayElement: true
  comparable: true
  comparisonCaution: null
  confidence: official-doc
  source: "Siemens S7-1200 manual — Data types"
  notes: "One byte, single quotes. Supports extended ASCII and $-escaped control characters ($L/$N/$P/$R/$T/$$/$')."

WChar:
  category: character
  sizeBits: 16
  signed: null
  numberRepresentations:
    - { form: character, range: "16#0000 to 16#FFFF", example: "'A', 't', '@', 'ä', '∑', Asian/Cyrillic characters" }
  addressExamples: []
  availableInPlcTagsEditor: true
  validArrayElement: true
  comparable: true
  comparisonCaution: null
  confidence: official-doc
  source: "Siemens S7-1200 manual — Data types"
  notes: "One word (double-byte), same single-quote literal syntax as Char despite the name — verified against the manual's own constant-entry examples (they still show single quotes for WChar)."

