# Which datatypes are legal in which VAR_* interface section (Constant,
# InOut, Input, Output, Static, Temp). Source: data-types-ext/*.md,
# user-confirmed against Siemens' own reference tables for S7-1200/S7-1500
# (2026-07-13). confidence: official-doc, same tier as base-types.yaml.
#
# EVENT_HWINT / OB_HWINT (originally transcribed as EVENT_HWNT / OB_HWNT
# from data-types-ext) corrected 2026-07-13 after platform-availability.NOTLOADED.yaml
# confirmed that spelling from a second, independent Siemens source
# (the "Overview of the valid data types" table) — see that file's
# trailing `notes` block.
#
# This is a different axis than base-types.yaml / composition-rules.yaml:
# those describe what a type IS (size, ranges, nesting rules); this file
# describes WHERE a given type name may legally be declared. A lint
# server should check both — e.g. `Variant` is a valid Datatype per
# base-types.yaml, but illegal in a `Static` or `Output` section per this
# file.
#
# Several type names below (HW_*, OB_*, EVENT_*, CONN_*, DB_ANY/DB_DYN/
# DB_WWW, IEC_*, PID_Compact*, AOM_IDENT, PORT, PIP, RTM, OPC_UA_*, CREF,
# NREF, Remote, ErrorStruct, F_SYSINFO) are NOT in base-types.yaml —
# they're system/parameter/library types with no entry there yet, and
# not PLC data types (UDTs) resolvable via udt-dependency-cache.md
# either. Treat them here as opaque legal names: a lint server checking
# section legality only needs "is this name allowed in this section",
# not their internal structure. `Any` and `Pointer` USED to be in this
# list too — RESOLVED 2026-07-13, both now have real base-types.yaml
# entries (see any-pointer.yaml and pointer-type.yaml for their full
# shape) and no longer need opaque-name treatment.
#
# Current limitation: the sections below describe code-block VAR_* contexts.
# A PLC data type's member list is a separate declaration context and is not
# modeled here. Do not reuse Static's `additionalDatatypes` for UDT members
# without independently established rules.

