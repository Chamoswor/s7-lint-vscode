# "Array[0..1] of" is not a literal type name — data-types-ext used it as
# a placeholder to mean "array types are permitted here" (any bounds, any
# element type). A lint server should treat any `TypeRef` of kind "array"
# (see udt-dependency-cache.md) as matching this entry, not do a literal
# string match against "Array[0..1] of".
