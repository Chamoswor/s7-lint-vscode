ErrorStruct:
  sizeBytes: 28
  category: system-struct
  description: "Error information for a programming or I/O access error."
  usedByInstructions: [GET_ERROR]
  members:
    - name: ERROR_ID
      type: { kind: named, name: Word }
      defaultValue: "16#0"
    - name: FLAGS
      type: { kind: named, name: Byte }
      defaultValue: "16#0"
      notes: "SOURCED 2026-07-13 from GetError's own reference page: 16#01 = error occurred during a program block CALL specifically; 16#00 = no error during a program block call (the error, if any, occurred elsewhere, e.g. within the current block's own instructions rather than at a call boundary)."
    - name: REACTION
      type: { kind: named, name: Byte }
      defaultValue: "16#0"
      notes: "SOURCED 2026-07-13 from GetError's own reference page — the CPU's default system reaction to this error: 0 = Ignore (write error); 1 = Continue with substitute value 0 (read error); 2 = Skip instruction (system error). GetError's own worked example checks REACTION=1 specifically via EQ_Contact to detect a read/access error and reset a downstream flag — the canonical lint-relevant use of this field."
    - name: CODE_ADDRESS
      type: { kind: named, name: CREF }
    - name: MODE
      type: { kind: named, name: Byte }
      defaultValue: "16#0"
    - name: OPERAND_NUMBER
      type: { kind: named, name: UInt }
      defaultValue: 0
    - name: POINTER_NUMBER_LOCATION
      type: { kind: named, name: UInt }
      defaultValue: 0
    - name: SLOT_NUMBER_SCOPE
      type: { kind: named, name: UInt }
      defaultValue: 0
    - name: DATA_ADDRESS
      type: { kind: named, name: NREF }
  errorIdCodes:
    notes: "SOURCED 2026-07-13 from the GetError ('Get error locally', GET_ERROR) instruction's own reference page — the legal values of the ERROR_ID member specifically. Cross-referenced from instruction-registry/10-runtime-control.yaml's GetError entry rather than duplicated there, per this project's duplication standard."
    "0000": "No error"
    "2503": "Invalid pointer"
    "2520": "Invalid STRING"
    "2522": "Read error: Operand outside the valid range"
    "2523": "Write error: Operand outside the valid range"
    "2524": "Read error: Invalid operand"
    "2525": "Write error: Invalid operand"
    "2528": "Read error: Data alignment"
    "2529": "Write error: Data alignment"
    "252C": "Invalid pointer"
    "2530": "Write error: Data block"
    "2533": "Invalid reference used"
    "2538": "Access error: DB does not exist"
    "2539": "Access error: Wrong DB used"
    "253A": "Global data block does not exist"
    "253C": "Faulty information or the function does not exist"
    "253D": "System function does not exist"
    "253E": "Faulty information or the function block does not exist"
    "253F": "System block does not exist"
    "2550": "Access error: DB does not exist"
    "2551": "Access error: Wrong DB used"
    "2575": "Error in the program nesting depth"
    "2576": "Error in the local data distribution"
    "2577": "The block property 'Parameter passing via registers' is not selected"
    "25A0": "Internal error in TP"
    "25A1": "Tag is write-protected"
    "25A2": "Invalid numerical value of tag"
    "2942": "Read error: Input"
    "2943": "Write error: Output"
  confidence: official-doc
  source: "TIA Portal Interface editor export, pasted by user, 2026-07-13; GetError/GET_ERROR instruction reference page, pasted by user, 2026-07-13"
  notes: "RESOLVED naming mismatch — confirmed real TIA export key is 'ErrorStruct' (matches section-legality.yaml), not 'ERROR_STRUCT' as the Siemens 'System data types' reference page spelled it; treat ErrorStruct as canonical. Size checks out: ERROR_ID(2)+FLAGS(1)+REACTION(1)+CODE_ADDRESS(CREF,8)+MODE(1)+1 pad(to 2-byte-align OPERAND_NUMBER)+OPERAND_NUMBER(2)+POINTER_NUMBER_LOCATION(2)+SLOT_NUMBER_SCOPE(2)+DATA_ADDRESS(NREF,8) = 28. Also: unlike every system-struct filled in so far, this export's per-member ExternalAccessible/ExternalVisible/ExternalWritable/SetPoint columns are NOT uniformly False (top-level fields show True/True/True/False) — the file-header claim that they're 'uniformly False for every system-struct member' is wrong; they're just not being recorded here regardless, since they're TIA export metadata rather than shape data. INDEPENDENTLY RE-CONFIRMED 2026-07-13 via a real compiled XML block export (TEST.xml's fully-expanded nested <Section Name=\"None\"> members for a SystemVar1/ErrorStruct field) — exact same 9-member set, order, and types. XML also confirms `Version=\"1.0\"` accompanies the Datatype attribute for system-struct references (matches the .udt file's `LibVersion := '1.0'` observation). THIRD INDEPENDENT CONFIRMATION 2026-07-13 via GetError's own reference page, which reprints the exact same 9-member set/order/types a third time, plus a REACTION value table and a FLAGS bit meaning that were NOT previously captured — both now recorded directly on their own member entries above (REACTION.notes / FLAGS.notes)."

