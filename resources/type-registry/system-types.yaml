  notes: "PT+ET (4 bytes each, Time) + IN+Q (rounds up in the struct layout) accounts for the 16-byte sizeBytes above. INDEPENDENTLY RE-CONFIRMED 2026-07-13 via a real compiled XML block export (TEST.xml, SystemArray2/IEC_TIMER's fully-expanded nested <Section Name=\"None\"> members) — exact same PT/ET/IN/Q member set and types. Two independent sources now agree. usedByInstructions' RT/PT entries CORRECTED 2026-07-13 to RT_Coil/PT_Coil — matches the actual instruction-registry/04-timers.yaml keys (coil-ref call shape); the bare 'PT' name would otherwise be ambiguous with this same struct's own PT member."

