NREF:
  sizeBytes: 8
  category: system-struct
  description: "Component of ErrorStruct — address information about an operand."
  usedByInstructions: []
  members:
    - name: AREA
      type: { kind: named, name: Byte }
      defaultValue: "16#0"
      notes: "SOURCED 2026-07-13 from GetError's own reference page — memory area encoding: L = 16#40-16#7F, 16#86, 16#87, 16#8E, 16#8F, 16#C0-16#FF; I = 16#81; Q = 16#82; M = 16#83; DB = 16#40, 16#84, 16#85, 16#8A, 16#8B; PI = 16#01; PQ = 16#02; Technological objects = 16#04. FLAGGED, transcribed exactly as the doc gives it: L's range and DB's code set BOTH include 16#40 — the same single byte value cannot legally decode to two different memory areas, so this looks like a Siemens doc transcription artifact (possibly L's range should start higher, e.g. 16#50 or similar) rather than genuine overlap; not silently corrected since the true boundary isn't independently known. A THIRD distinct memory-area coding scheme in this project, alongside any-pointer.yaml's `memoryAreaCodes` (B#16#80-87 range, ANY-pointer-specific) and pointer-type.yaml's own table (also its own distinct range/values) — do not conflate the three; each belongs to its own pointer/reference mechanism and none of them share a single canonical code space."
    - name: DB_NUMBER
      type: { kind: named, name: UInt }
      defaultValue: 0
    - name: OFFSET
      type: { kind: named, name: UDInt }
      defaultValue: 0
  confidence: official-doc
  source: "TIA Portal Interface editor export, pasted by user, 2026-07-13; GetError/GET_ERROR instruction reference page, pasted by user, 2026-07-13"
  notes: "Also a directly-declarable section type per section-legality.yaml (InOut/Input/Output/Static/Temp), not only nested inside ErrorStruct. Size checks out: AREA(1) + 1 pad (to 2-byte-align DB_NUMBER) + DB_NUMBER(2) + OFFSET(4) = 8. INDEPENDENTLY RE-CONFIRMED 2026-07-13 via TEST.xml's fully-expanded DATA_ADDRESS/NREF nested members — exact same 3-member set/order/types. THIRD CONFIRMATION 2026-07-13 via GetError's own reference page, which also supplied AREA's value table (see that member's notes, including a flagged apparent transcription overlap at 16#40) — not previously captured."

