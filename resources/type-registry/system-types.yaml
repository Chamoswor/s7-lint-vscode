  usedByInstructions: [TP, TOF, TON, TONR, RT_Coil, PT_Coil]
  members:
    - name: PT
      type: { kind: named, name: Time }
    - name: ET
      type: { kind: named, name: Time }
    - name: IN
      type: { kind: named, name: Bool }
    - name: Q
