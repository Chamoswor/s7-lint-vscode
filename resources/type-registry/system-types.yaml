# Siemens system data types — types shipped with TIA Portal itself
# (not user-authored) that don't fit base-types.yaml (elementary types)
# or udt-dependency-cache.md (user-defined UDTs). Two shapes, both under
# `category`:
#
#   - `system-struct`  — fixed-member STRUCTs (IEC_TIMER, ERROR_STRUCT,
#     TCON_Param, ...). `members` is the eventual field-level breakdown.
#   - `system-alias`   — single-parent identifier/handle types with a
#     `basicDataType` pointing either straight at a base-types.yaml
#     elementary type (e.g. HW_ANY -> UInt) or at ANOTHER entry in this
#     same file (e.g. HW_HSC -> HW_SUBMODULE -> HW_IO -> HW_ANY -> UInt).
#     Resolving one of these to its real storage type means walking
#     `basicDataType` recursively until it lands on a base-types.yaml
#     name — the same "walk until you hit a known leaf" idea
#     udt-dependency-cache.md uses for UDTs, just a single edge per node
#     instead of a member list.
#
# Pasted directly from Siemens' TIA Portal Information System "System
# data types" / "Hardware data types" reference pages by the user
# (2026-07-13). confidence: official-doc.
#
# Several of these are already referenced as opaque legal section names
# in section-legality.yaml (IEC_TIMER, IEC_LTIMER, IEC_*COUNTER, CREF,
# NREF, ErrorStruct, HW_ANY, HW_DEVICE, HW_DPSLAVE, HW_HSC, HW_IEPORT,
# HW_INTERFACE, HW_IO, HW_IOSYSTEM, HW_MODULE, HW_PTO, HW_PWM,
# HW_SUBMODULE, EVENT_ANY, EVENT_ATT, EVENT_HWNT, OB_*, PORT, RTM, PIP,
# CONN_ANY, CONN_OUC, CONN_PRG, DB_ANY, DB_DYN, DB_WWW, AOM_IDENT). NOTE
# naming mismatches spotted between that file (transcribed from
# data-types-ext) and this one (transcribed from the Siemens hardware
# data types page) — verify the exact spelling against a real .s7dcl/.xml
# export before picking one canonically for the linter:
#   - ErrorStruct / ERROR_STRUCT — RESOLVED 2026-07-13: a real TIA
#     Interface editor export confirms the key is 'ErrorStruct' (matches
#     section-legality.yaml); the Siemens 'System data types' reference
#     page's 'ERROR_STRUCT' spelling was not what TIA itself uses.
#   - EVENT_HWINT / OB_HWINT — RESOLVED 2026-07-13: platform-availability.NOTLOADED.yaml
#     (a second, independent Siemens source) agrees with the spelling
#     used here; section-legality.yaml's EVENT_HWNT / OB_HWNT was a
#     transcription typo and has been corrected to match.
# `HW_DPMASTER` and `CONN_R_ID` are new here and not present in
# section-legality.yaml — RESOLVED: platform-availability.NOTLOADED.yaml shows
# both are S7-1500-only, so their absence from data-types-ext
# (S7-1200-scoped) is expected, not a registry gap. `Remote` (originally
# transcribed here as `REMOTE` from the Siemens hardware-data-types page)
# — RESOLVED 2026-07-13: real TIA export confirms `Remote`, matching
# section-legality.yaml exactly; entry below renamed to match.
#
# `members` is null on every `system-struct` entry until it's been
# mapped from a real TIA Portal reference (Interface editor "Var" row
# export) — not guessed here. Once filled, each entry is:
#
#   members:
#     - name: PT
#       type: { kind: named, name: Time }
#     - name: LOCAL_TSAP_ID
#       type: { kind: array, bounds: [[1, 16]], of: { kind: named, name: Byte } }
#       comment: "TSAP id/local port number"
#     - name: ERROR_ID
#       type: { kind: named, name: Word }
#       defaultValue: "16#0"
#
# `type` reuses udt-dependency-cache.md's TypeRef shape verbatim (`kind:
# named | array | inline-struct`) so a resolver written for UDT members
# works unchanged on system-struct members. `comment` is the source
# export's description column, omitted when TIA didn't have one for that
# row. `defaultValue` is the export's Default value column, omitted when
# blank (e.g. CREF/NREF/other struct-typed members never have one). The
# export's four per-member BooleanAttribute columns (ExternalAccessible/
# ExternalVisible/ExternalWritable/SetPoint, see copilot-instructions.md's
# Member schema) are NOT carried into `members` — they vary per struct
# (ErrorStruct's top-level fields are True/True/True/False, not the
# uniform False seen in IEC_TIMER/TCON_Param/PID_CompactConfig), so
# they're not safe to assume and not load-bearing for shape-checking
# either way; skip recording them per-member.

