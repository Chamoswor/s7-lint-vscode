ResolvedSymbol:
  sizeBytes: 3
  category: system-struct
  description: "Saves references to tags in the PLC program, plus status information for generating the references. Required for the 'Symbolic access during runtime' function (see symbolic-runtime-access.yaml)."
  usedByInstructions: ["CountOfElements (IN parameter — CONFIRMED 2026-07-13, official doc for 'Get number of ARRAY elements' explicitly lists VARIANT/ResolvedSymbol as IN's legal types)", "ResolveSymbols (referenceList parameter — CONFIRMED 2026-07-13 from ResolveSymbols' own official doc: 'specify an Array of ResolvedSymbol (SDT) in which the references are to be saved' — upgraded from the earlier 'plausible, unconfirmed' guess)", "MoveResolvedSymbolsToBuffer (src parameter — CONFIRMED 2026-07-13 from the 'Symbolic access during runtime' overview doc's step-2 example: 'the Array of ResolvedSymbol (SDT) that contains the references to the resolved tags')", "MoveResolvedSymbolsFromBuffer (dst parameter — INFERRED by src/dst symmetry with MoveResolvedSymbolsToBuffer, NOT independently doc-confirmed — see that instruction's own entry notes in instruction-registry/06-move.yaml)"]
  memoryArea: "MUST be in an OPTIMIZED memory area — a hard requirement per the SDT's own reference page, not just a general recommendation. This directly matches ResolveSymbols' own pin-level note that referenceList (an Array of ResolvedSymbol) must be optimized, now confirmed from the type's own side too, not just the instruction's."
  platformNote: "As of FW V3.0 (matching symbolic-runtime-access.yaml's overall S7-1500 FW>=V3.0 gate), ResolvedSymbol can additionally be declared as an element of a PLC data type (UDT) — not just used directly as an ARRAY element type in a block interface/DB the way it's used by ResolveSymbols/CountOfElements/MoveResolvedSymbolsToBuffer above."
  members:
    - name: status
      type: { kind: named, name: Int }
      notes: "0 = the tag was resolved cleanly and the struct's contents are reliable. Non-zero has DIFFERENT meanings depending on `resolved`'s value (see that member's notes) — status is not simply an error/no-error flag on its own, its meaning is conditional on resolved. A NEGATIVE status value (when resolved=FALSE) means the symbol itself couldn't be resolved (e.g. a range violation); a POSITIVE status value (when resolved=FALSE) means the tag exists but isn't accessible/writable via HMI/OPC UA/Web API — sign carries real semantic meaning here, not just magnitude. Error-code table (W#16#..., i.e. these are effectively unsigned/hex-displayed despite the signed-INT type and the negative-vs-positive distinction above — a linter should not assume the hex codes below are the literal negative-status case, that distinction is separate from this list): 8021 the WSTRING tag name is empty; 8022 the WSTRING tag name contains invalid characters; 8023 the referenced tag's data type declaration is missing; 8024 the reference points to a tag that no longer exists (may have been overwritten by a RUN-mode load — see the entry-level runMode note); 8054 the referenced tag's data type isn't supported for symbolic access (cross-reference symbolic-runtime-access.yaml's accessTable for which types ARE supported); 80B4 the project is inconsistent."
    - name: resolved
      type: { kind: named, name: Bool }
      notes: "Combines with `status` to form FOUR distinct states, not a simple pass/fail: (1) resolved=FALSE, status=0 -> no resolution attempt has been made yet (the initial/reset state — matches ResolveSymbols' own doc note that referenceList's array values are RESET before resolution begins). (2) resolved=FALSE, status<>0 -> resolution FAILED; status's value (and its sign) indicates why/where, see status's own notes. (3) resolved=TRUE, status=0 -> successfully resolved, struct contents reliable. (4) resolved=TRUE, status<>0 -> was successfully resolved at the time, but the underlying DB has since been overwritten by a RUN-mode load, making the struct's reference potentially stale/invalid despite resolved still reading TRUE — a real 'looks fine but isn't' trap worth a lint/runtime-guidance note, not just an error case."
  internalHiddenParameters: "Beyond `resolved`/`status`, the SDT contains INTERNAL parameters (data type, length, and address of the referenced tag) that are NOT accessible/visible to the program — confirms this struct's real member list is intentionally incomplete from the program's point of view, not a gap in this file's own transcription. Do not attempt to model these as additional `members` entries — they're genuinely opaque by Siemens' own design, unlike this project's other 'gap, needs more data' flags."
  runModeInvalidation: "A DB containing resolved references can be overwritten by a subsequent download/load while the CPU is in RUN — when that happens, a previously-successful reference (resolved=TRUE) can go stale (status becomes non-zero, case 4 above) or point at a tag that no longer exists at all (status=8024). Siemens' own recommended recovery pattern (SCL, paraphrased): before each MoveResolvedSymbolsToBuffer/FromBuffer call, check resolved/status per entry; if a copy fails anyway (the Move instruction's own RET_VAL/err-style output reports a failed-copy COUNT, not per-element detail), scan the whole array with a FOR loop, find entries with resolved=FALSE, and re-run the asynchronous ResolveSymbols instruction to refresh them. This is a real, Siemens-documented usage pattern worth surfacing as a lint suggestion (flag MoveResolvedSymbolsToBuffer/FromBuffer calls with no apparent preceding resolved/status guard) rather than a hard correctness rule, since it's a runtime-robustness concern, not a static type error."
  confidence: official-doc
  source: "TIA Portal Interface editor export, pasted by user, 2026-07-13; SDT reference page (Description/Structure/Invalid-references sections), pasted by user, 2026-07-13"
  notes: "Not present in section-legality.yaml or data-types-ext — same caveat as VREF. Size checks out exactly: status (Int, 2) + resolved (Bool, 1) = 3. Lowercase member names (status/resolved) are notable — every other system-struct so far uses UPPER_CASE or CamelCase members; this one doesn't."

