    dataTypes: [Time]
  template:
    shape: none
    keys: []
    extra: {}
  confidence: official-doc
  notes: >-
    Set a cyclic-interrupt OB's cycle time/phase offset.
  source: "official instruction documentation (paraphrased)"
  result:
    kind: value
    dataTypes: [Int]
    notes: SCL function return value.
