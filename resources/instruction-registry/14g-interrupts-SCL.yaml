  family: extended
  callShape: box
  instanceType: null
  pins:
  - name: OB_NR
    dir: in
    required: true
    note: ''
    dataTypes: [OB_CYCLIC]
  - name: CYCLE
    dir: out
    required: false
    note: ''
    dataTypes: [Time]
  - name: PHASE
    dir: out
    required: false
    note: ''
    dataTypes: [Time]
  - name: STATUS
    dir: out
    required: false
    note: ''
    dataTypes: [Word]
  template:
    shape: none
    keys: []
    extra: {}
  confidence: official-doc
  notes: >-
    Query a cyclic-interrupt OB's current cycle time/phase/status, read-side counterpart of SET_CINT.
  source: "official instruction documentation (paraphrased)"
  result:
    kind: value
    dataTypes: [Int]
    notes: SCL function return value.
