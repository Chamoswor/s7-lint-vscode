# Interrupt and fault-event control — SCL registry.
#
# SCL callable names and parameter casing use Siemens' canonical spelling.
# Function returns are represented by `result`, not by graphical OUT/RET_VAL pins.
#
# S_Move and generic S_CONV are intentionally not emitted as callable SCL
# entries. Their SCL forms are assignment and typed <source>_TO_<destination>
# conversion respectively. T_COMBINE expands to CONCAT_DATE_TOD or
# CONCAT_DATE_LTOD.
#
# Missing dataTypes are intentional; unresolved types are never guessed.

$fileLanguage: [SCL]
ATTACH:
  family: extended
  callShape: box
  instanceType: null
  pins:
  - name: OB_NR
    dir: in
    required: true
    note: ''
    dataTypes: [OB_ANY]
  - name: EVENT
    dir: in
    required: true
    note: ''
    dataTypes: [EVENT_ANY]
  - name: ADD
    dir: in
    required: true
    note: ''
    dataTypes: [Bool]
  template:
    shape: none
    keys: []
    extra: {}
  confidence: official-doc
  notes: >-
    Attach an OB to a hardware-interrupt event.
  source: "official instruction documentation (paraphrased)"
  result:
    kind: value
    dataTypes: [Int]
    notes: SCL function return value.
DETACH:
  family: extended
  callShape: box
  instanceType: null
  pins:
  - name: OB_NR
    dir: in
    required: true
    note: ''
    dataTypes: [OB_ANY]
  - name: EVENT
    dir: in
    required: true
    note: ''
    dataTypes: [EVENT_ANY]
  template:
    shape: none
    keys: []
    extra: {}
  confidence: official-doc
  notes: >-
    Detach an OB from a hardware-interrupt event, inverse of ATTACH.
  source: "official instruction documentation (paraphrased)"
  result:
    kind: value
    dataTypes: [Int]
    notes: SCL function return value.
