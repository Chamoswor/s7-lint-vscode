    dir: in
    required: true
    note: ''
    dataTypes: [DWord]
  - name: UAMethod_Finished
    dir: in
    required: true
    note: ''
    dataTypes: [Bool]
  - name: Done
    dir: out
    required: true
    note: ''
    dataTypes: [Bool]
  - name: Busy
    dir: out
    required: true
    note: ''
    dataTypes: [Bool]
  - name: Error
    dir: out
    required: true
    note: ''
    dataTypes: [Bool]
  - name: Status
    dir: out
    required: true
    note: ''
    dataTypes: [DWord]
  - name: UAMethod_OutParameters
    dir: inout
    required: true
    note: ''
    dataTypes: [Variant]
  template:
    shape: none
    keys: []
    extra: {}
  confidence: official-doc
  notes: >-
    . OPC UA server-method-call postamble FB, paired with OPC_UA_ServerMethodPre above.
  source: "official instruction documentation (paraphrased)"
