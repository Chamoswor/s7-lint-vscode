# TSN communication configuration — SCL registry.
#
# Instruction names and named-parameter casing use the exact Siemens spelling.
# No automatic case transformation is applied.
#
# These are FB/library/procedure calls, not value-returning functions. Every
# entry therefore has `result: { kind: none }`. For FB instance calls only
# InOut operands remain structurally required; bare FC/procedure calls retain
# required input and InOut operands.
#
# Missing dataTypes are intentional: unknown types are not guessed.

$fileLanguage: [SCL]
TC_CONFIG:
  family: communication
  callShape: instance-dot
  instanceType: TC_CONFIG
  pins:
  - name: REQ
    dir: in
    required: false
    note: ''
    dataTypes: [Bool]
  - name: INTERFACE
    dir: in
    required: false
    note: ''
  - name: BUSY
    dir: out
    required: false
    note: ''
    dataTypes: [Bool]
  - name: DONE
    dir: out
    required: false
    note: ''
    dataTypes: [Bool]
  - name: ERROR
    dir: out
    required: false
    note: ''
    dataTypes: [Bool]
  - name: STATUS
    dir: out
    required: false
    note: ''
    dataTypes: [Word]
  - name: CONFIG
    dir: in
    required: false
    note: ''
  template:
    shape: none
    keys: []
    extra: {}
  confidence: shape-only
  notes: >-
    . Time-sensitive-communication (TSN) interface configuration FB.
  source: "anonymized reference fixture (signature only)"
  result:
    kind: none
