ResolveSymbols:
  family: move
  callShape: instance-dot
  instanceType: ResolveSymbols
  pins:
  - name: execute
    dir: in
    required: false
    dataTypes:
    - Bool
    memoryAreas:
    - I
    - Q
    - M
    - D
    - L
    note: Rising edge starts the asynchronous job.
  - name: firstIndex
    dir: in
    required: false
    dataTypes:
    - DInt
    memoryAreas:
    - I
    - Q
    - M
    - D
    - L
    - C
    note: First ARRAY index to resolve.
  - name: lastIndex
    dir: in
    required: false
    dataTypes:
    - DInt
    memoryAreas:
    - I
    - Q
    - M
    - D
    - L
    - C
    note: Last ARRAY index to resolve.
  - name: done
    dir: out
    required: false
    dataTypes:
    - Bool
    memoryAreas:
    - I
    - Q
    - M
    - D
    - L
    note: TRUE for one cycle when the job completes.
  - name: busy
    dir: out
    required: false
    dataTypes:
    - Bool
    memoryAreas:
    - I
    - Q
    - M
    - D
    - L
    note: TRUE while the job is active.
  - name: error
    dir: out
    required: false
    dataTypes:
    - Bool
    memoryAreas:
    - I
    - Q
    - M
    - D
    - L
    note: TRUE when an error occurred.
  - name: status
    dir: out
    required: false
    dataTypes:
    - Int
    memoryAreas:
    - I
    - Q
    - M
    - D
    - L
    note: Job status or error code.
  - name: nameList
    dir: inout
    required: true
    dataTypes:
    - Array
    memoryAreas:
    - D
    note: ARRAY of WSTRING containing fully qualified symbolic names.
  - name: referenceList
    dir: inout
    required: true
    dataTypes:
    - Array
    memoryAreas:
    - D
    note: Optimized ARRAY of ResolvedSymbol receiving references.
  result:
    kind: none
  template:
    shape: none
    keys: []
    extra: {}
  confidence: official-doc
  notes: >-
    S7-1500 asynchronous instance call. nameList and referenceList must have identical ARRAY limits; referenceList must be in an optimized global DB.
  source: "official instruction documentation (paraphrased)"
