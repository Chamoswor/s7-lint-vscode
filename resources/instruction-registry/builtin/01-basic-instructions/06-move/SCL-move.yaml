    kind: inferred
    rule: same-as-source
    sourcePins:
    - 0
    notes: Byte-reversed value with the same datatype as the operand; assignable to I, Q, M, D, L or P.
  template:
    shape: none
    keys: []
    extra: {}
  confidence: official-doc
  notes: >-
    Reverses the byte order of the positional expression. Example: #Result := SWAP(#Value);
  source: "official instruction documentation (paraphrased)"
