SCATTER:
  family: move
  callShape: box
  instanceType: null
  pins:
  - name: IN
    dir: in
    required: true
    dataTypes:
    - Byte
    - Word
    - DWord
    - LWord
    memoryAreas:
    - I
    - Q
    - M
    - D
    - L
    note: Bit sequence to split; LWORD is S7-1500-only.
  - name: OUT
    dir: out
    required: true
    dataTypes:
    - Array
    - Struct
    - PLC data type
    memoryAreas:
    - I
    - Q
    - M
    - D
    - L
    note: Equally sized BOOL ARRAY, anonymous STRUCT or PLC datatype.
  result:
    kind: none
  template:
    shape: none
    keys: []
    extra: {}
  confidence: official-doc
  notes: >-
    Splits one bit sequence into BOOL members. The destination must contain exactly 8, 16, 32 or 64 BOOL elements and may not be a multidimensional ARRAY.
  source: "official instruction documentation (paraphrased)"
SCATTER_BLK:
  family: move
  callShape: box
  instanceType: null
  pins:
  - name: IN
    dir: in
    required: true
    dataTypes:
    - Byte
    - Word
    - DWord
    - LWord
    memoryAreas:
    - I
    - Q
    - M
    - D
    - L
    note: Element of an ARRAY[*] of bit sequences; LWORD is S7-1500-only.
  - name: COUNT_IN
    dir: in
    required: true
    dataTypes:
    - USInt
    - UInt
    - UDInt
    - ULInt
    memoryAreas:
    - I
    - Q
    - M
    - D
    - L
    note: Number of source ARRAY elements to parse.
  - name: OUT
    dir: out
    required: true
    dataTypes:
    - Bool
    - Struct
    - PLC data type
    memoryAreas:
    - I
    - Q
    - M
    - D
    - L
    note: Starting element of the destination ARRAY[*] of BOOL/STRUCT/PLC datatype.
  result:
    kind: none
  template:
    shape: none
    keys: []
    extra: {}
  confidence: official-doc
  notes: >-
    Splits COUNT_IN consecutive bit-sequence ARRAY elements into BOOL storage. The destination index must satisfy the documented bit-width alignment rule.
  source: "official instruction documentation (paraphrased)"
