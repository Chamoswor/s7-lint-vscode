# SCL move-instruction registry.
#
# Native SCL assignment (`:=`) represents ordinary MOVE semantics and is not a
# callable instruction entry. AssignmentAttempt is likewise the native `?=`
# operator and is intentionally omitted from this call registry.
#
# Procedures with explicit OUT/IN_OUT parameters use `result.kind: none`.
# Functions return their RET_VAL or calculated value through `result`:
# MOVE_BLK_VARIANT, Deserialize, Serialize, SWAP, CountOfElements,
# LOWER_BOUND, UPPER_BOUND and the two resolved-symbol buffer functions.
#
# ResolveSymbols is an instance call. The retained `instance-dot` callShape is
# the registry's existing instance category; actual SCL syntax calls the
# instance directly, for example `"ResolveSymbols_DB"(...);`.
#
$fileLanguage:
- SCL
MOVE_BLK:
  family: move
  callShape: box
  instanceType: null
  pins:
  - name: IN
    dir: in
    required: true
    dataTypes:
    - Bit strings
    - Integers
    - Floating-point numbers
    - Timers
    - Date
    - Char
    - WChar
    - Time_Of_Day
    - LTime_Of_Day
    memoryAreas:
    - D
    - L
    note: First source ARRAY element.
  - name: COUNT
    dir: in
    required: true
    dataTypes:
    - USInt
    - UInt
    - UDInt
    - ULInt
    memoryAreas:
    - I
    - Q
    - M
    - D
    - L
    - P
    note: Number of consecutive elements to copy; ULINT is S7-1500-only.
  - name: OUT
    dir: out
    required: true
    dataTypes:
    - Bit strings
    - Integers
    - Floating-point numbers
    - Timers
    - Date
    - Char
    - WChar
    - Time_Of_Day
    - LTime_Of_Day
    memoryAreas:
    - D
    - L
    note: First destination ARRAY element.
  result:
    kind: none
  template:
    shape: none
    keys: []
    extra: {}
  confidence: official-doc
  notes: >-
    Copies COUNT consecutive ARRAY elements from IN to OUT. Source and destination element datatypes must match.
  source: "official instruction documentation (paraphrased)"
MOVE_BLK_VARIANT:
  family: move
  callShape: box
  instanceType: null
  pins:
  - name: SRC
    dir: in
    required: true
    dataTypes:
    - Variant
    - Array
    memoryAreas:
    - L
    note: VARIANT or ARRAY source; declaration is limited to Input, InOut or Temp.
  - name: COUNT
    dir: in
    required: true
    dataTypes:
    - UDInt
    memoryAreas:
    - I
    - Q
    - M
    - D
    - L
    note: Number of elements to copy; use 1 for a single non-ARRAY value.
  - name: SRC_INDEX
    dir: in
    required: true
    dataTypes:
    - DInt
    memoryAreas:
    - I
    - Q
    - M
    - D
    - L
    note: Zero-based source index independent of the declared ARRAY limits.
  - name: DEST_INDEX
    dir: in
    required: true
    dataTypes:
    - DInt
    memoryAreas:
    - I
    - Q
    - M
    - D
    - L
    note: Zero-based destination index independent of the declared ARRAY limits.
  - name: DEST
    dir: out
    required: true
    dataTypes:
    - Variant
    memoryAreas:
    - L
    note: Destination VARIANT. The actual destination tag must be declared InOut.
  result:
    kind: value
    dataTypes:
    - Int
    notes: RET_VAL error information; function value may be assigned to I, Q, M, D or L.
  template:
    shape: none
    keys: []
    extra: {}
  confidence: official-doc
  notes: >-
    Copies a complete ARRAY or selected ARRAY range through VARIANT operands. BOOL and ARRAY of BOOL are not valid SRC values.
  source: "official instruction documentation (paraphrased)"
