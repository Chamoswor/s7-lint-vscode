# SCL conversion-operation registry.
#
# SCL conversion operations are functions. Their calculated value is represented
# by `result`, never by an OUT pin.
#
# The CONVERT palette operation generates a concrete <source>_TO_<destination>
# function call in SCL; `CONVERT(...)` is therefore not registered as a callable
# SCL function. Typed conversion entries cover documented source/destination
# pairs. Notes retain only behavioral constraints, and source metadata records
# the evidence tier without internal corpus names.

$fileLanguage: [SCL]

ROUND:
  family: conversion
  callShape: box
  instanceType: null
  pins:
  - name: null
    dir: in
    required: true
    dataTypes: [Floating-point numbers]
    memoryAreas: [I, Q, M, D, L, P]
    note: Floating-point expression to round.
  result:
    kind: inferred
    rule: instruction-specific
    sourcePins: [0]
    dataTypes: [Integers, Floating-point numbers]
    notes: Nearest integer value. The suffix ROUND_<datatype> may select the result datatype explicitly; the documented
      default is DInt.
  template:
    shape: none
    keys: []
    extra: {}
  confidence: official-doc
  notes: >-
    Rounds to nearest using ties-to-even. Example: #Result := ROUND_REAL(#Value);
  source: "official instruction documentation (paraphrased)"
