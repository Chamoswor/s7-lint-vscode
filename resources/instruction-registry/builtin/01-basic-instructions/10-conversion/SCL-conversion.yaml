  result:
    kind: inferred
    rule: instruction-specific
    sourcePins: [0]
    dataTypes: [Integers, Floating-point numbers]
    notes: Smallest integer value greater than or equal to the input. CEIL_<datatype> selects the result datatype;
      default DInt.
  template:
    shape: none
    keys: []
    extra: {}
  confidence: official-doc
  notes: >-
    Function form with no OUT parameter. Example: #Result := CEIL_REAL(#Value);
  source: "official instruction documentation (paraphrased)"
