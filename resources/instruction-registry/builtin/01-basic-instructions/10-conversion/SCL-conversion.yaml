  - name: VALUE
    dir: in
    required: true
    dataTypes: [Floating-point numbers]
    memoryAreas: [I, Q, M, D, L, constant]
    note: Normalized value to scale. A constant used here must be declared.
  - name: MAX
    dir: in
    required: true
    dataTypes: [Integers, Floating-point numbers]
    memoryAreas: [I, Q, M, D, L, constant]
    note: High limit of the destination range.
  result:
    kind: inferred
    rule: instruction-specific
    sourcePins: [0, 1, 2]
    dataTypes: [Integers, Floating-point numbers]
    notes: Scaled function value. SCALE_X_<datatype> selects the result datatype; the documented default is Int.
  template:
    shape: none
    keys: []
    extra: {}
  confidence: official-doc
  notes: >-
    Function form: #Result := SCALE_X(MIN := #Min, VALUE := #Value, MAX := #Max). There is no OUT
    parameter.
  source: "official instruction documentation (paraphrased)"
