# LAD/FBD math instruction registry.
#
# This file models graphical math boxes. Their calculated value is exposed
# through an explicit OUT pin, or written back through the single operand of
# INC/DEC. They therefore do not have a separate function return value:
#
#   result:
#     kind: none
#
# Memory-area conventions from Siemens STEP 7 V21:
# - Ordinary numeric/expression inputs: I, Q, M, D, L, P or constant.
# - Explicit OUT pins: I, Q, M, D, L or P.
# - INC/DEC read/write operand: I, Q, M, D or L.
#
# EN and ENO remain represented by the existing `enEno` field. EN permits T
# and C only on S7-1500 where the individual instruction table states this.
#
# `inN` represents additional consecutively numbered graphical inputs. It is
# a registry placeholder, not a literal pin name in exported block code.
#
$fileLanguage: [LAD, FBD]

Calculate:
  family: math
  callShape: box
  instanceType:
  pins:
  - {name: in1, dir: in, required: true, dataTypes: ["Bit strings", "Integers", "Floating-point numbers"], note: "First
      input operand.", memoryAreas: [I, Q, M, D, L, P, constant]}
  - {name: in2, dir: in, required: true, dataTypes: ["Bit strings", "Integers", "Floating-point numbers"], note: "Second
      input operand.", memoryAreas: [I, Q, M, D, L, P, constant]}
  - {name: inN, dir: in, required: false, dataTypes: ["Bit strings", "Integers", "Floating-point numbers"], note: "Optional
      consecutively numbered additional input operands.", memoryAreas: [I, Q, M, D, L, P, constant]}
  - {name: out, dir: out, required: true, dataTypes: ["Bit strings", "Integers", "Floating-point numbers"], note: "Calculated
      output value.", memoryAreas: [I, Q, M, D, L, P]}
  result:
    kind: none
  enEno:
    en: {present: true, dataTypes: [Bool], memoryArea: {"S7-1200": [I, Q, M, D, L, constant], "S7-1500": [I, Q, M, D, L, T, C, constant]}}
    eno: {present: true, dataTypes: [Bool], memoryArea: {"S7-1200": [I, Q, M, D, L], "S7-1500": [I, Q, M, D, L]}}
  template: {shape: none, keys: [], extra: {}}
  confidence: shape-only
  notes: >-
    Evaluates the expression configured in the CALCULATE dialog and writes the final value to OUT.
    Additional inputs are numbered consecutively and may not contain gaps.
  source: "docs/fbd-knowhow/05-Math.md"
