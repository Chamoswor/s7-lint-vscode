  - {name: out, dir: out, required: true, dataTypes: ["Integers", "Floating-point numbers"], note: "Calculated output
      value.", memoryAreas: [I, Q, M, D, L, P]}
  result:
    kind: none
  enEno:
    en: {present: true, dataTypes: [Bool], memoryArea: {"S7-1200": [I, Q, M, D, L, constant], "S7-1500": [I, Q, M, D, L, T, C, constant]}}
    eno: {present: true, dataTypes: [Bool], memoryArea: {"S7-1200": [I, Q, M, D, L], "S7-1500": [I, Q, M, D, L]}}
  template: {shape: none, keys: [], extra: {}}
  confidence: confirmed-compiled
  notes: >-
    Adds IN1, IN2 and any consecutively inserted INn inputs. The selected numeric type determines range,
    overflow and floating-point behavior.
  source: "docs/fbd-knowhow/05-Math.md"
