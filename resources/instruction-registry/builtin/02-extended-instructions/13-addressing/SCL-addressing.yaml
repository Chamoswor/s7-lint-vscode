# Hardware and I/O address conversion — SCL registry.
#
# SCL callable names and parameter casing use Siemens' canonical spelling.
# Function returns are represented by `result`, not by graphical OUT/RET_VAL pins.
#
# S_Move and generic S_CONV are intentionally not emitted as callable SCL
# entries. Their SCL forms are assignment and typed <source>_TO_<destination>
# conversion respectively. T_COMBINE expands to CONCAT_DATE_TOD or
# CONCAT_DATE_LTOD.
#
# Missing dataTypes are intentional; unresolved types are never guessed.

$fileLanguage: [SCL]
GEO2LOG:
  family: extended
  callShape: box
  instanceType: null
  pins:
  - name: GEOADDR
    dir: in
    required: true
    note: ''
    dataTypes: [Variant]
  - name: LADDR
    dir: out
    required: false
    note: ''
    dataTypes: [HW_ANY]
  template:
    shape: none
    keys: []
    extra: {}
  confidence: official-doc
  notes: >-
    Convert a slot's geographic (rack/slot) address to its logical (hardware ID) address.
  source: "official instruction documentation (paraphrased)"
  result:
    kind: value
    dataTypes: [Int]
    notes: SCL function return value.
LOG2GEO:
  family: extended
  callShape: box
  instanceType: null
  pins:
  - name: LADDR
    dir: in
    required: true
    note: ''
    dataTypes: [HW_ANY]
  - name: GEOADDR
    dir: out
    required: false
    note: ''
    dataTypes: [Variant]
  template:
    shape: none
    keys: []
    extra: {}
  confidence: official-doc
  notes: >-
    Convert a logical address to its geographic address, inverse of GEO2LOG.
  source: "official instruction documentation (paraphrased)"
  result:
    kind: value
    dataTypes: [Int]
    notes: SCL function return value.
IO2MOD:
  family: extended
  callShape: box
  instanceType: null
  pins:
  - name: ADDR
    dir: in
    required: true
    note: ''
    dataTypes: [UInt]
  - name: LADDR
    dir: out
    required: false
    note: ''
    dataTypes: [HW_ANY]
  template:
    shape: none
    keys: []
    extra: {}
  confidence: official-doc
  notes: >-
    Convert an I/O address to the logical address of the module that occupies it.
  source: "official instruction documentation (paraphrased)"
  result:
    kind: value
    dataTypes: [Int]
    notes: SCL function return value.
RD_ADDR:
  family: extended
  callShape: box
  instanceType: null
  pins:
  - name: LADDR
    dir: in
    required: true
    note: ''
    dataTypes: [HW_ANY]
  - name: PIADDR
    dir: out
    required: false
    note: ''
    dataTypes: [UInt]
  - name: PICount
    dir: out
    required: false
    note: ''
    dataTypes: [UInt]
  - name: PQADDR
    dir: out
    required: false
    note: ''
    dataTypes: [UInt]
  - name: PQCount
    dir: out
    required: false
    note: ''
    dataTypes: [UInt]
  template:
    shape: none
    keys: []
    extra: {}
  confidence: official-doc
  notes: >-
    Read a module's process-image input/output address ranges.
  source: "official instruction documentation (paraphrased)"
  result:
    kind: value
    dataTypes: [Int]
    notes: SCL function return value.
