# Runtime data-block functions — SCL registry.
#
# SCL callable names and parameter casing use Siemens' canonical spelling.
# Function returns are represented by `result`, not by graphical OUT/RET_VAL pins.
#
# S_Move and generic S_CONV are intentionally not emitted as callable SCL
# entries. Their SCL forms are assignment and typed <source>_TO_<destination>
# conversion respectively. T_COMBINE expands to CONCAT_DATE_TOD or
# CONCAT_DATE_LTOD.
#
# Missing dataTypes are intentional; unresolved types are never guessed.

$fileLanguage: [SCL]
CREATE_DB:
  family: extended
  callShape: box
  instanceType: null
  pins:
  - name: REQ
    dir: in
    required: true
    note: ''
    dataTypes: [Bool]
  - name: LOW_LIMIT
    dir: in
    required: true
    note: ''
    dataTypes: [UInt]
  - name: UP_LIMIT
    dir: in
    required: true
    note: ''
    dataTypes: [UInt]
  - name: COUNT
    dir: in
    required: true
    note: ''
    dataTypes: [UInt]
  - name: ATTRIB
    dir: in
    required: true
    note: ''
    dataTypes: [Byte]
  - name: SRCBLK
    dir: in
    required: true
    note: ''
    dataTypes: [DB_ANY]
  - name: BUSY
    dir: out
    required: false
    note: ''
    dataTypes: [Bool]
  - name: DB_NUM
    dir: out
    required: false
    note: ''
    dataTypes: [UInt]
  template:
    shape: none
    keys: []
    extra: {}
  confidence: official-doc
  notes: >-
    Dynamically create a new data block at runtime.
  source: "official instruction documentation (paraphrased)"
  result:
    kind: value
    dataTypes: [Int]
    notes: SCL function return value.
