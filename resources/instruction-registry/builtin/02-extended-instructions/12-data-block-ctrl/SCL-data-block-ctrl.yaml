    note: ''
    dataTypes: [Bool]
  - name: SRCBLK
    dir: in
    required: true
    note: ''
    dataTypes: [DB_ANY]
  - name: BUSY
    dir: out
    required: false
    note: ''
    dataTypes: [Bool]
  - name: DSTBLK
    dir: out
    required: false
    note: ''
    dataTypes: [DB_ANY]
  template:
    shape: none
    keys: []
    extra: {}
  confidence: official-doc
  notes: >-
    Read a data block from the load memory into the work memory.
  source: "official instruction documentation (paraphrased)"
  result:
    kind: value
    dataTypes: [Int]
    notes: SCL function return value.
