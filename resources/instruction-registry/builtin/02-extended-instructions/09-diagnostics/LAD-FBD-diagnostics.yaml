# System and module diagnostics — LAD/FBD registry.
#
# Graphical instruction aliases and pin casing are retained from anonymized
# reference fixtures and apply to both LAD and FBD.
#
# Exported `:=` connections cannot distinguish INPUT from IN_OUT. Independently
# documented IN_OUT parameters are corrected explicitly.
#
# Graphical instructions use pins and therefore have `result: { kind: none }`.
# Missing dataTypes are intentional; unresolved types are never guessed.

$fileLanguage: [LAD, FBD]
RD_SINFO:
  family: extended
  callShape: box
  instanceType: null
  pins:
  - name: RET_VAL
    dir: out
    required: true
    note: ''
    dataTypes: [Int]
  - name: TOP_SI
    dir: out
    required: true
    note: ''
    dataTypes: [Variant]
  - name: START_UP_SI
    dir: out
    required: true
    note: ''
    dataTypes: [Variant]
  template:
    shape: none
    keys: []
    extra: {}
  confidence: official-doc
  notes: >-
    Read the start info of the OB that most recently called the calling block.
  source: "official instruction documentation (paraphrased)"
  result:
    kind: none
