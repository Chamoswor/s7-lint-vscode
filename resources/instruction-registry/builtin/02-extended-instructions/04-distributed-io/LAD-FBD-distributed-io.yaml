# Distributed I/O and data-record access — LAD/FBD registry.
#
# Graphical instruction aliases and pin casing are retained from anonymized
# reference fixtures and apply to both LAD and FBD.
#
# Exported `:=` connections cannot distinguish INPUT from IN_OUT. Independently
# documented IN_OUT parameters are corrected explicitly.
#
# Graphical instructions use pins and therefore have `result: { kind: none }`.
# Missing dataTypes are intentional; unresolved types are never guessed.

$fileLanguage: [LAD, FBD]
RDREC:
  family: extended
  callShape: instance-dot
  instanceType: RDREC
  pins:
  - name: REQ
    dir: in
    required: true
    note: ''
    dataTypes: [Bool]
  - name: ID
    dir: in
    required: true
    note: ''
    dataTypes: [HW_IO]
  - name: INDEX
    dir: in
    required: true
    note: ''
    dataTypes: [UInt]
  - name: MLEN
    dir: in
    required: true
    note: ''
    dataTypes: [UInt]
  - name: VALID
    dir: out
    required: true
    note: ''
    dataTypes: [Bool]
  - name: BUSY
    dir: out
    required: true
    note: ''
    dataTypes: [Bool]
  - name: ERROR
    dir: out
    required: true
    note: ''
    dataTypes: [Bool]
  - name: STATUS
    dir: out
    required: true
    note: ''
    dataTypes: [DWord]
  - name: LEN
    dir: out
    required: true
    note: ''
    dataTypes: [UInt]
  - name: RECORD
    dir: inout
    required: true
    note: ''
    dataTypes: [Variant]
  template:
    shape: none
    keys: []
    extra: {}
  confidence: official-doc
  notes: >-
    Read a data record from a module/device.
  source: "official instruction documentation (paraphrased)"
  result:
    kind: none
