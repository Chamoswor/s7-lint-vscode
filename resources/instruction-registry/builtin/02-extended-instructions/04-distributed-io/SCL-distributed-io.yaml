# Distributed I/O and data-record access — SCL registry.
#
# SCL callable names and parameter casing use Siemens' canonical spelling.
# Function returns are represented by `result`, not by graphical OUT/RET_VAL pins.
#
# S_Move and generic S_CONV are intentionally not emitted as callable SCL
# entries. Their SCL forms are assignment and typed <source>_TO_<destination>
# conversion respectively. T_COMBINE expands to CONCAT_DATE_TOD or
# CONCAT_DATE_LTOD.
#
# Missing dataTypes are intentional; unresolved types are never guessed.

$fileLanguage: [SCL]
RDREC:
  family: extended
  callShape: instance-dot
  instanceType: RDREC
  pins:
  - name: REQ
    dir: in
    required: false
    note: ''
    dataTypes: [Bool]
  - name: ID
    dir: in
    required: false
    note: ''
    dataTypes: [HW_IO]
  - name: INDEX
    dir: in
    required: false
    note: ''
    dataTypes: [UInt]
  - name: MLEN
    dir: in
    required: false
    note: ''
    dataTypes: [UInt]
  - name: VALID
    dir: out
    required: false
    note: ''
    dataTypes: [Bool]
  - name: BUSY
    dir: out
    required: false
    note: ''
    dataTypes: [Bool]
  - name: ERROR
    dir: out
    required: false
    note: ''
    dataTypes: [Bool]
  - name: STATUS
    dir: out
    required: false
    note: ''
    dataTypes: [DWord]
  - name: LEN
    dir: out
    required: false
    note: ''
    dataTypes: [UInt]
  - name: RECORD
    dir: inout
    required: true
    note: ''
    dataTypes: [Variant]
  template:
    shape: none
    keys: []
    extra: {}
  confidence: official-doc
  notes: >-
    Read a data record from a module/device.
  source: "official instruction documentation (paraphrased)"
  result:
    kind: none
