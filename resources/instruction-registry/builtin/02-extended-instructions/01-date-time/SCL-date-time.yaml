# Date, time-of-day and runtime-meter instructions — SCL registry.
#
# SCL callable names and parameter casing use Siemens' canonical spelling.
# Function returns are represented by `result`, not by graphical OUT/RET_VAL pins.
#
# S_Move and generic S_CONV are intentionally not emitted as callable SCL
# entries. Their SCL forms are assignment and typed <source>_TO_<destination>
# conversion respectively. T_COMBINE expands to CONCAT_DATE_TOD or
# CONCAT_DATE_LTOD.
#
# Missing dataTypes are intentional; unresolved types are never guessed.

$fileLanguage: [SCL]
T_COMP:
  family: extended
  callShape: box
  instanceType: null
  pins:
  - name: in1
    dir: in
    required: true
    note: ''
    dataTypes: [Timers, Date and time]
  - name: in2
    dir: in
    required: true
    note: ''
    dataTypes: [Timers, Date and time]
  template:
    shape: none
    keys: []
    extra: {}
  confidence: official-doc
  notes: >-
    Compares time values using a preceding `S7_Relation` pragma such as `EQ`. The `template` field models
    only `S7_Templates`, so the relation pragma is not represented there.
  source: "official instruction documentation (paraphrased)"
  result:
    kind: value
    dataTypes: [Bool]
    notes: SCL function return value.
T_CONV:
  family: extended
  callShape: box
  instanceType: null
  pins:
  - name: in
    dir: in
    required: true
    note: ''
    dataTypes: [Timers, Date and time]
  template:
    shape: none
    keys: []
    extra: {}
  confidence: official-doc
  notes: >-
    Time-value type conversion.
  source: "official instruction documentation (paraphrased)"
  result:
    kind: inferred
    rule: instruction-specific
    notes: SCL function return datatype depends on the selected source/destination datatype or instruction variant.
