CONCAT_DATE_TOD:
  family: extended
  callShape: box
  instanceType: null
  pins:
  - name: IN1
    dir: in
    required: true
    dataTypes: [Date]
    note: Calendar date.
  - name: IN2
    dir: in
    required: true
    dataTypes: [Time_Of_Day]
    note: Time of day.
  template:
    shape: none
    keys: []
    extra: {}
  confidence: official-doc
  notes: >-
    Canonical internal SCL function generated from graphical T_COMBINE: CONCAT_DATE_TOD. Siemens
    displays one of these two names when T_COMBINE is inserted into an SCL block.
  source: "official instruction documentation (paraphrased)"
  result:
    kind: value
    dataTypes: [Date_And_Time]
    notes: Combined DATE and TOD value.
