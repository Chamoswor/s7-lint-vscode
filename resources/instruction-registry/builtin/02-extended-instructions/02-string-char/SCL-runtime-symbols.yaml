GetSymbolForReference:
  family: extended
  callShape: instance-dot
  instanceType: GetSymbolForReference
  pins:
  - name: execute
    dir: in
    required: false
    note: ''
    dataTypes: [Bool]
  - name: objectRef
    dir: in
    required: false
    note: ''
    dataTypes: [Reference]
  - name: size
    dir: in
    required: false
    note: ''
    dataTypes: [UInt]
  - name: done
