# PWM and PTO pulse control — SCL registry.
#
# SCL callable names and parameter casing use Siemens' canonical spelling.
# Function returns are represented by `result`, not by graphical OUT/RET_VAL pins.
#
# S_Move and generic S_CONV are intentionally not emitted as callable SCL
# entries. Their SCL forms are assignment and typed <source>_TO_<destination>
# conversion respectively. T_COMBINE expands to CONCAT_DATE_TOD or
# CONCAT_DATE_LTOD.
#
# Missing dataTypes are intentional; unresolved types are never guessed.

$fileLanguage: [SCL]
CTRL_PWM:
  family: extended
  callShape: instance-dot
  instanceType: CTRL_PWM
  pins:
  - name: PWM
    dir: in
    required: false
    note: ''
    dataTypes: [HW_PWM]
  - name: ENABLE
    dir: in
    required: false
    note: ''
    dataTypes: [Bool]
  - name: BUSY
    dir: out
    required: false
    note: ''
    dataTypes: [Bool]
  - name: STATUS
    dir: out
    required: false
    note: ''
    dataTypes: [Word]
  template:
    shape: none
    keys: []
    extra: {}
  confidence: official-doc
  notes: >-
    Control a pulse-width-modulation hardware output.
  source: "official instruction documentation (paraphrased)"
  result:
    kind: none
CTRL_PTO:
  family: extended
  callShape: instance-dot
  instanceType: CTRL_PTO
  pins:
  - name: REQ
    dir: in
    required: false
    note: ''
    dataTypes: [Bool]
  - name: PTO
    dir: in
    required: false
    note: ''
    dataTypes: [HW_PTO]
  - name: FREQUENCY
    dir: in
    required: false
    note: ''
    dataTypes: [UDInt]
  - name: DONE
    dir: out
    required: false
    note: ''
    dataTypes: [Bool]
  - name: BUSY
    dir: out
    required: false
    note: ''
    dataTypes: [Bool]
  - name: ERROR
    dir: out
    required: false
    note: ''
    dataTypes: [Bool]
  - name: STATUS
    dir: out
    required: false
    note: ''
    dataTypes: [Word]
  template:
    shape: none
    keys: []
    extra: {}
  confidence: official-doc
  notes: >-
    Control a pulse-train-output hardware output at a given frequency (distinct from the MC_*_PTO Motion
    Control FBs in 12f-motion-pto-SCL.yaml, which drive a PTO via positioning commands rather than a raw
    frequency).
  source: "official instruction documentation (paraphrased)"
  result:
    kind: none
