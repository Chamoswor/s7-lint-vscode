# HSC, PID and signal-processing technology instructions — SCL registry.
#
# SCL instruction keys use canonical Siemens capitalization. Pin spelling is
# retained from the exported interface except for documented casing corrections:
# ErrorId -> ErrorID, DiagId -> DiagID and TIO_SYNC_DATA -> TIO_SYNC_Data.
#
# These are FB/technology-object instance calls, not functions. The instance is
# called directly in SCL; `result.kind` is therefore `none`. `instance-dot` is
# retained as the existing registry category for instance calls.
#
# Missing dataTypes are intentional: no type is fabricated where the export and
# a Siemens parameter table did not establish it.

$fileLanguage: [SCL]
CTRL_HSC_EXT:
  family: technology
  callShape: instance-dot
  instanceType: CTRL_HSC_EXT
  pins:
  - name: HSC
    dir: in
    required: false
    note: ''
    dataTypes: [HW_HSC]
  - name: DONE
    dir: out
    required: false
    note: ''
    dataTypes: [Bool]
  - name: BUSY
    dir: out
    required: false
    note: ''
    dataTypes: [Bool]
  - name: ERROR
    dir: out
    required: false
    note: ''
    dataTypes: [Bool]
  - name: STATUS
    dir: out
    required: false
    note: ''
    dataTypes: [Word]
  - name: CTRL
    dir: inout
    required: true
    note: ''
    dataTypes: [Variant]
  template:
    shape: none
    keys: []
    extra: {}
  confidence: official-doc
  notes: >-
    High-speed counter extended control FB.
  source: "official instruction documentation (paraphrased)"
  result:
    kind: none
