# PTO Motion Control technology instructions — LAD/FBD registry.
#
# Graphical instruction keys and pin spelling follow anonymized reference
# fixture evidence and apply to both LAD and FBD. `:=` cannot distinguish INPUT from IN_OUT, so only independently
# verified IN_OUT declarations were corrected.
#
# Every entry is an FB/technology-object call and therefore has
# `result: { kind: none }`. Missing dataTypes are intentional: no type is
# fabricated where the export and a Siemens parameter table did not establish it.

$fileLanguage: [LAD, FBD]
MC_Power_PTO:
  family: technology
  callShape: instance-dot
  instanceType: MC_Power_PTO
  pins:
  - name: Axis
    dir: in
    required: true
    note: ''
  - name: Enable
    dir: in
    required: true
    note: ''
    dataTypes: [Bool]
  - name: StopMode
    dir: in
    required: true
    note: ''
  - name: Status
    dir: out
    required: true
    note: ''
  - name: Busy
    dir: out
    required: true
    note: ''
    dataTypes: [Bool]
  - name: Error
    dir: out
    required: true
    note: ''
    dataTypes: [Bool]
  - name: ErrorID
    dir: out
    required: true
    note: ''
    dataTypes: [Word]
  - name: ErrorInfo
    dir: out
    required: true
    note: ''
    dataTypes: [Word]
  template:
    shape: none
    keys: []
    extra: {}
  confidence: shape-only
  notes: >-
    Pulse-Train-Output (PTO, no TO-instance/no encoder feedback) Motion Control FB (axis enable/power).
    Note ErrorID/ErrorInfo casing here vs. the TO-based MC_* FBs' ErrorId — a real family split between
    PTO axes and TO-based axes, transcribed as each export actually spells it.
  source: "anonymized reference fixture (signature only)"
  result:
    kind: none
