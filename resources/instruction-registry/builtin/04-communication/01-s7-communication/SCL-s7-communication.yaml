# S7 connection communication — SCL registry.
#
# Instruction names and named-parameter casing use the exact Siemens spelling.
# No automatic case transformation is applied.
#
# These are FB/library/procedure calls, not value-returning functions. Every
# entry therefore has `result: { kind: none }`. For FB instance calls only
# InOut operands remain structurally required; bare FC/procedure calls retain
# required input and InOut operands.
#
# Missing dataTypes are intentional: unknown types are not guessed.

$fileLanguage: [SCL]
GET:
  family: communication
  callShape: instance-dot
  instanceType: GET
  pins:
  - name: REQ
    dir: in
    required: false
    note: ''
    dataTypes: [Bool]
  - name: ID
    dir: in
    required: false
    note: ''
    dataTypes: [Word]
  - name: NDR
    dir: out
    required: false
    note: ''
    dataTypes: [Bool]
  - name: ERROR
    dir: out
    required: false
    note: ''
    dataTypes: [Bool]
  - name: STATUS
    dir: out
    required: false
    note: ''
    dataTypes: [Word]
  - name: ADDR_1
    dir: inout
    required: true
    note: ''
    dataTypes: [Remote]
  - name: ADDR_2
    dir: inout
    required: true
    note: ''
    dataTypes: [Remote]
  - name: ADDR_3
    dir: inout
    required: true
    note: ''
    dataTypes: [Remote]
  - name: ADDR_4
    dir: inout
    required: true
    note: ''
    dataTypes: [Remote]
  - name: RD_1
    dir: inout
    required: true
    note: ''
    dataTypes: [Variant]
  - name: RD_2
    dir: inout
    required: true
    note: ''
    dataTypes: [Variant]
  - name: RD_3
    dir: inout
    required: true
    note: ''
    dataTypes: [Variant]
  - name: RD_4
    dir: inout
    required: true
    note: ''
    dataTypes: [Variant]
  template:
    shape: none
    keys: []
    extra: {}
  confidence: official-doc
  notes: >-
    . S7 communication FB (read data from a remote CPU).
  source: "official instruction documentation (paraphrased)"
  result:
    kind: none
