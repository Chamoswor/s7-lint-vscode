# Modbus RTU communication — SCL registry.
#
# Instruction names and named-parameter casing use the exact Siemens spelling.
# No automatic case transformation is applied.
#
# These are FB/library/procedure calls, not value-returning functions. Every
# entry therefore has `result: { kind: none }`. For FB instance calls only
# InOut operands remain structurally required; bare FC/procedure calls retain
# required input and InOut operands.
#
# Missing dataTypes are intentional: unknown types are not guessed.

$fileLanguage: [SCL]
Modbus_Comm_Load:
  family: communication
  callShape: instance-dot
  instanceType: Modbus_Comm_Load
  pins:
  - name: REQ
    dir: in
    required: false
    note: ''
    dataTypes: [Bool]
  - name: PORT
    dir: in
    required: false
    note: ''
    dataTypes: [PORT]
  - name: BAUD
    dir: in
    required: false
    note: ''
    dataTypes: [UDInt]
  - name: PARITY
    dir: in
    required: false
    note: ''
    dataTypes: [UInt]
  - name: FLOW_CTRL
    dir: in
    required: false
    note: ''
    dataTypes: [UInt]
  - name: RTS_ON_DLY
    dir: in
    required: false
    note: ''
    dataTypes: [UInt]
  - name: RTS_OFF_DLY
    dir: in
    required: false
    note: ''
    dataTypes: [UInt]
  - name: RESP_TO
    dir: in
    required: false
    note: ''
    dataTypes: [UInt]
  - name: DONE
    dir: out
    required: false
    note: ''
    dataTypes: [Bool]
  - name: ERROR
    dir: out
    required: false
    note: ''
    dataTypes: [Bool]
  - name: STATUS
    dir: out
    required: false
    note: ''
    dataTypes: [Word]
  - name: MB_DB
    dir: inout
    required: true
    note: ''
    dataTypes: [PLC data type]
  template:
    shape: none
    keys: []
    extra: {}
  confidence: official-doc
  notes: >-
    . Modbus RTU (serial) communication load/configuration FB.
  source: "official instruction documentation (paraphrased)"
  result:
    kind: none
