# Program alarms and alarm management — SCL registry.
#
# SCL callable names and parameter casing use Siemens' canonical spelling.
# Function returns are represented by `result`, not by graphical OUT/RET_VAL pins.
#
# S_Move and generic S_CONV are intentionally not emitted as callable SCL
# entries. Their SCL forms are assignment and typed <source>_TO_<destination>
# conversion respectively. T_COMBINE expands to CONCAT_DATE_TOD or
# CONCAT_DATE_LTOD.
#
# Missing dataTypes are intentional; unresolved types are never guessed.

$fileLanguage: [SCL]
Program_Alarm:
  family: extended
  callShape: instance-dot
  instanceType: Program_Alarm
  pins:
  - name: SIG
    dir: in
    required: false
    note: ''
    dataTypes: [Bool]
  - name: TIMESTAMP
    dir: in
    required: false
    note: Optional alarm timestamp.
    dataTypes: [LDT]
  - name: SD_1
    dir: in
    required: false
    note: First associated value.
    dataTypes: [Variant]
  - name: SD_2
    dir: in
    required: false
    note: Optional associated value 2.
    dataTypes: [Variant]
  - name: SD_3
    dir: in
    required: false
    note: Optional associated value 3.
    dataTypes: [Variant]
  - name: SD_4
    dir: in
    required: false
    note: Optional associated value 4.
    dataTypes: [Variant]
  - name: SD_5
    dir: in
    required: false
    note: Optional associated value 5.
    dataTypes: [Variant]
  - name: SD_6
    dir: in
    required: false
    note: Optional associated value 6.
    dataTypes: [Variant]
  - name: SD_7
    dir: in
    required: false
    note: Optional associated value 7.
    dataTypes: [Variant]
  - name: SD_8
    dir: in
    required: false
    note: Optional associated value 8.
    dataTypes: [Variant]
  - name: SD_9
    dir: in
    required: false
    note: Optional associated value 9.
    dataTypes: [Variant]
  - name: SD_10
    dir: in
    required: false
    note: Optional associated value 10.
    dataTypes: [Variant]
  - name: Error
    dir: out
    required: false
    note: Optional error flag.
    dataTypes: [Bool]
  - name: Status
    dir: out
    required: false
    note: Optional status word.
    dataTypes: [Word]
  template:
    shape: none
    keys: []
    extra: {}
  confidence: official-doc
  notes: >-
    Program-alarm FB with up to ten associated values. Required parameters are based on anonymized
    compiling SCL fixture evidence.
  source: "official instruction documentation (paraphrased)"
  result:
    kind: none
