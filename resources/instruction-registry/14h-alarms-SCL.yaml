  family: extended
  callShape: box
  instanceType: null
  pins:
  - name: Mode
    dir: in
    required: true
    note: ''
    dataTypes: [UInt]
  - name: TextID
    dir: in
    required: true
    note: ''
    dataTypes: [UInt]
  - name: TextListID
    dir: in
    required: true
    note: ''
    dataTypes: [UInt]
  - name: AssocValues
    dir: in
    required: true
