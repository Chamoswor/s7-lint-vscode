  callShape: box
  instanceType: null
  pins:
  - name: Alarm
    dir: in
    required: true
    note: ''
    dataTypes: [Variant]
  - name: AlarmState
    dir: out
    required: false
    note: ''
    dataTypes: [UInt]
  - name: Error
    dir: out
    required: false
    note: ''
    dataTypes: [Bool]
  - name: STATUS
    dir: out
    required: false
    note: ''
    dataTypes: [Word]
  template:
    shape: none
    keys: []
    extra: {}
  confidence: official-doc
  notes: >-
    Query the current state of a program alarm.
  source: "official instruction documentation (paraphrased)"
  result:
    kind: none
