      memoryAreas: [I, Q, M, D, L, P]
      note: Positional floating-point expression whose fractional part is returned.

  result:
    kind: inferred
    rule: instruction-specific
    sourcePins: [0]
    dataTypes: ["Floating-point numbers"]
    notes: >-
      Floating-point function value. The result datatype may be selected
      explicitly with FRAC_<datatype>; otherwise it is inferred from typed
      operands/constants, with REAL as the default.

  template: { shape: none, keys: [], extra: {} }
  confidence: official-doc
  notes: >-
    Returns the fractional part of the input, for example 1.125 -> 0.125. Example explicit result type:
    FRAC_LREAL(#Value).
  source: "official instruction documentation (paraphrased)"