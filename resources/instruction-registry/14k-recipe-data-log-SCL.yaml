# Recipe and data-log instructions — SCL registry.
#
# SCL callable names and parameter casing use Siemens' canonical spelling.
# Function returns are represented by `result`, not by graphical OUT/RET_VAL pins.
#
# S_Move and generic S_CONV are intentionally not emitted as callable SCL
# entries. Their SCL forms are assignment and typed <source>_TO_<destination>
# conversion respectively. T_COMBINE expands to CONCAT_DATE_TOD or
# CONCAT_DATE_LTOD.
#
# Missing dataTypes are intentional; unresolved types are never guessed.

$fileLanguage: [SCL]
RecipeExport:
  family: extended
  callShape: instance-dot
  instanceType: RecipeExport
  pins:
  - name: REQ
    dir: in
    required: false
    note: ''
    dataTypes: [Bool]
  - name: DONE
    dir: out
    required: false
    note: ''
    dataTypes: [Bool]
  - name: BUSY
    dir: out
    required: false
    note: ''
    dataTypes: [Bool]
  - name: ERROR
    dir: out
    required: false
    note: ''
    dataTypes: [Bool]
  - name: STATUS
    dir: out
    required: false
    note: ''
    dataTypes: [Word]
  - name: RECIPE_DB
    dir: inout
    required: true
    note: ''
    dataTypes: [DB_ANY]
  template:
    shape: none
    keys: []
    extra: {}
  confidence: official-doc
  notes: >-
    Export a recipe data block to a memory card.
  source: "official instruction documentation (paraphrased)"
  result:
    kind: none
