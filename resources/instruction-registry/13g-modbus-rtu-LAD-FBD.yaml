    dir: in
    required: true
    note: ''
    dataTypes: [Bool]
  - name: PORT
    dir: in
    required: true
    note: ''
    dataTypes: [PORT]
  - name: BAUD
    dir: in
    required: true
    note: ''
    dataTypes: [UDInt]
  - name: PARITY
    dir: in
    required: true
    note: ''
    dataTypes: [UInt]
  - name: FLOW_CTRL
    dir: in
    required: true
    note: ''
    dataTypes: [UInt]
  - name: RTS_ON_DLY
    dir: in
    required: true
    note: ''
    dataTypes: [UInt]
  - name: RTS_OFF_DLY
    dir: in
    required: true
    note: ''
    dataTypes: [UInt]
  - name: RESP_TO
    dir: in
    required: true
    note: ''
    dataTypes: [UInt]
  - name: DONE
    dir: out
    required: true
    note: ''
    dataTypes: [Bool]
  - name: ERROR
    dir: out
    required: true
    note: ''
    dataTypes: [Bool]
  - name: STATUS
    dir: out
    required: true
    note: ''
    dataTypes: [Word]
  - name: MB_DB
    dir: inout
    required: true
    note: ''
    dataTypes: [PLC data type]
  template:
    shape: none
    keys: []
    extra: {}
  confidence: official-doc
  notes: >-
    . Modbus RTU (serial) communication load/configuration FB.
  source: "official instruction documentation (paraphrased)"
  result:
    kind: none
