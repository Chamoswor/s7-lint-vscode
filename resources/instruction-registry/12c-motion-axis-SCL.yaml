# S7-1500 axis, measuring-input, cam-output and torque instructions — SCL registry.
#
# SCL instruction keys use canonical Siemens capitalization. Pin spelling is
# retained from the exported interface except for documented casing corrections:
# ErrorId -> ErrorID, DiagId -> DiagID and TIO_SYNC_DATA -> TIO_SYNC_Data.
#
# These are FB/technology-object instance calls, not functions. The instance is
# called directly in SCL; `result.kind` is therefore `none`. `instance-dot` is
# retained as the existing registry category for instance calls.
#
# Missing dataTypes are intentional: no type is fabricated where the export and
# a Siemens parameter table did not establish it.

$fileLanguage: [SCL]
MC_Power:
  family: technology
  callShape: instance-dot
  instanceType: MC_POWER
  pins:
  - name: Axis
    dir: in
    required: false
    note: ''
  - name: Enable
    dir: in
    required: false
    note: ''
    dataTypes: [Bool]
  - name: StartMode
    dir: in
    required: false
    note: ''
  - name: StopMode
    dir: in
    required: false
    note: ''
  - name: Status
    dir: out
    required: false
    note: ''
  - name: Busy
    dir: out
    required: false
    note: ''
    dataTypes: [Bool]
  - name: Error
    dir: out
    required: false
    note: ''
    dataTypes: [Bool]
  - name: ErrorID
    dir: out
    required: false
    note: ''
    dataTypes: [Word]
  template:
    shape: none
    keys: []
    extra: {}
  confidence: shape-only
  notes: >-
    Motion Control FB (axis enable/power).
  source: "anonymized reference fixture (signature only)"
  result:
    kind: none
