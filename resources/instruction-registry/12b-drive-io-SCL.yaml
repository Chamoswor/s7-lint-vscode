# SINAMICS BasicPosControl and time-based I/O technology instructions — SCL registry.
#
# SCL instruction keys use canonical Siemens capitalization. Pin spelling is
# retained from the exported interface except for documented casing corrections:
# ErrorId -> ErrorID, DiagId -> DiagID and TIO_SYNC_DATA -> TIO_SYNC_Data.
#
# These are FB/technology-object instance calls, not functions. The instance is
# called directly in SCL; `result.kind` is therefore `none`. `instance-dot` is
# retained as the existing registry category for instance calls.
#
# Missing dataTypes are intentional: no type is fabricated where the export and
# a Siemens parameter table did not establish it.

$fileLanguage: [SCL]
